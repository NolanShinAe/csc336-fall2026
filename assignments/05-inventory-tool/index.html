<html>
    <head>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <div id="selected"></div>
        <div id="dropdown"></div>

        <div>
            <button id="resetStoreButton" type="button">Reset Store</button>
        </div>

        <div id="root"></div>

        <div id="addNewProductDiv">
            <h4>Add New Product</h4>
            <form id="productForm">
                <label for="nameInputField">Product Name</label>
                <input id="nameInputField" name="name" type="text" required>

                <label for="priceInputField">Product Price</label>
                <input id="priceInputField" name="price" type="number" min="0.01" step="0.01" required>

                <label for="descriptionInputField">Product Description</label>
                <textarea id="descriptionInputField" name="description" minlength="20" required></textarea>

                <label for="categorySelectField">Product Category</label>
                <select id="categorySelectField" name="category" required>
                    <option value="">Select a category</option>
                </select>

                <label for="imageInputField">Product Image URL</label>
                <input id="imageInputField" name="image" type="url" required>

                <input type="submit">

                <p id="errorMessage"></p>
            </form>
        </div>

        <div id="cart"></div>
    </body>
</html>
